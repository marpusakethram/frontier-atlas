[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frontier-atlas-api"
version = "1.0.0"
description = "Frontier Atlas — Institutional-Grade Deep-Tech Investment Intelligence API"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
    "httpx>=0.27.2",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "scipy>=1.14.1",
    "networkx>=3.3",
    "apscheduler>=3.10.4",
    "google-genai>=1.0.0",
    "pymupdf>=1.24.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
