name: Frontier Atlas CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-verify:
    name: Backend Lint, Typecheck & Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run Ruff Linter
        run: uv run ruff check .
      - name: Run Unit, Integration & Evaluation Tests
        run: uv run pytest -v

  frontend-verify:
    name: Frontend Strict TypeScript & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck
      - name: Build Production Next.js Bundle
        run: npm run build
